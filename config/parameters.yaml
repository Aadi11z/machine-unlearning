experiment:
  name: vlm_unlearning
  seed: 42
  device: auto

data:
  # Change only this value to switch the complete pipeline.
  dataset: cifar10
  data_dir: data
  retain_val_fraction: 0.1
  profiles:
    cifar10:
      forget_classes: "3,5"
      # 1.0 forgets every sample in these classes; lower values select a
      # deterministic subset of samples from the selected classes.
      forget_fraction: 1.0
    cifar100:
      forget_classes: "54,62,70,82,92"
      forget_fraction: 1.0

outputs:
  root: outputs/{dataset}

model:
  model_name: openai/clip-vit-base-patch32
  prompt_template: "a photo of a {}"
  adapter_rank: 8
  adapter_alpha: 8.0
  train_logit_scale: true

training:
  batch_size: 128
  num_workers: 4
  lr: 0.003
  weight_decay: 0.0001
  epochs: 10
  max_train_steps: -1

unlearning:
  batch_size: 128
  num_workers: 4
  methods:
    - retain_only
    - ga_kl
    - counterfactual_rebind
    - entropy_rebind
  steps: 500
  lr: 0.0005
  kl_temperature: 1.5
  kl_weight: 1.0
  ga_weight: 1.0
  cf_weight: 1.0
  margin_weight: 0.5
  margin: 0.2
  entropy_weight: 1.0

attack:
  batch_size: 128
  num_workers: 4
  max_attack_samples: 4000
