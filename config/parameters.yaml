experiment:
  name: vlm_unlearning
  seed: 42
  device: auto

data:
  # Change only this value to switch the complete pipeline.
  dataset: cifar10
  data_dir: data
  retain_val_fraction: 0.1
  profiles:
    cifar10:
      forget_classes: "3,5"
      # 1.0 forgets every sample in these classes; lower values select a
      # deterministic subset of samples from the selected classes.
      forget_fraction: 1.0
    cifar100:
      # Change this field to rose_selective for fine-class forgetting.
      request: flowers_superclass
      forget_fraction: 1.0
      requests:
        flowers_superclass:
          request_type: superclass
          superclass: flowers
          target_classes: "54,62,70,82,92"
          sibling_classes: ""
        rose_selective:
          request_type: selective_class
          superclass: flowers
          target_classes: "70"
          sibling_classes: "54,62,82,92"

outputs:
  root: outputs/{dataset}

model:
  prompt_template: "a photo of a {}"
  profiles:
    cifar10:
      model_name: openai/clip-vit-base-patch32
      adapter_type: post_projection
      adapter_rank: 8
      adapter_alpha: 8.0
      train_logit_scale: true
      precision: fp32
      gradient_checkpointing: false
    cifar100:
      model_name: openai/clip-vit-base-patch16
      adapter_type: vision_lora
      lora_rank: 8
      lora_alpha: 8.0
      lora_layers: all
      lora_targets:
        - q_proj
        - v_proj
      train_logit_scale: true
      train_logit_scale_during_unlearning: false
      precision: bf16
      gradient_checkpointing: true

training:
  batch_size: 128
  profiles:
    cifar100:
      batch_size: 64
      gradient_accumulation_steps: 2
      persistent_workers: true
      non_blocking: true
  num_workers: 4
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  non_blocking: false
  gradient_accumulation_steps: 1
  lr: 0.003
  weight_decay: 0.0001
  epochs: 10
  max_train_steps: -1
  smoke:
    epochs: 1
    max_train_steps: 50
    max_eval_batches: 2

unlearning:
  batch_size: 128
  num_workers: 4
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  non_blocking: false
  profiles:
    cifar100:
      persistent_workers: true
      non_blocking: true
  methods:
    - retain_only
    - ga_kl
    - counterfactual_rebind
    - entropy_rebind
  steps: 500
  lr: 0.0005
  kl_temperature: 1.5
  kl_weight: 1.0
  ga_weight: 1.0
  cf_weight: 1.0
  margin_weight: 0.5
  margin: 0.2
  entropy_weight: 1.0

attack:
  batch_size: 128
  num_workers: 4
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  non_blocking: false
  profiles:
    cifar100:
      persistent_workers: true
      non_blocking: true
  max_attack_samples: 4000
